[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coticula"
version = "0.1.0"
description = "Coticula v0 — Coticula Understanding Bench for PDE surrogates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/shehbaz0101/coticula"
Repository = "https://github.com/shehbaz0101/coticula"

[project.optional-dependencies]
dev = ["pytest>=7.4"]
torch = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["metrics*", "baselines*", "scripts*", "datasets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
