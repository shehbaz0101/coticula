[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coticula"
version = "0.3.0"
description = "Coticula: a touchstone harness for PDE surrogates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/shehbaz0101/coticula"
Repository = "https://github.com/shehbaz0101/coticula"

[project.scripts]
coticula = "coticula.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "matplotlib>=3.8"]
torch = ["torch>=2.0"]
plot = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["metrics*", "baselines*", "scripts*", "datasets*", "coticula*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
